<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264076">
  <title>Demo floor plan: 3 bedrooms, 3 baths, about 1,650 sq ft</title>
  <rect width="640" height="440" fill="#f4f7fb"/>
  <g stroke="#264076" stroke-width="6" fill="none" stroke-linecap="square">
    <rect x="20" y="20" width="600" height="400"/>
    <path d="M220 20v150M220 230v190M420 20v120M420 200v220M20 250h140M220 250h200M420 140h200M420 300h200M520 300v120"/>
  </g>
  <g stroke="#264076" stroke-width="2" fill="none">
    <path d="M220 170a60 60 0 0 1 60 60" stroke-dasharray="4 4"/>
    <path d="M420 140a60 60 0 0 0 -60 60" stroke-dasharray="4 4"/>
    <path d="M160 250a60 60 0 0 1 60 -60" stroke-dasharray="4 4"/>
  </g>
  <g stroke="#2f6fb5" stroke-width="3">
    <path d="M80 20h80M300 20h60M500 20h80M20 330v60M620 200v60"/>
  </g>
  <g font-weight="bold" text-anchor="middle">
    <text x="120" y="130">MASTER BED</text>
    <text x="320" y="110">LIVING / DINING</text>
    <text x="520" y="80">BED 2</text>
    <text x="520" y="225">BATH</text>
    <text x="120" y="340">BED 3</text>
    <text x="320" y="340">KITCHEN</text>
    <text x="470" y="365">BATH</text>
    <text x="570" y="365">BATH</text>
  </g>
  <g fill="#5a6680" text-anchor="middle">
    <text x="120" y="148">15' × 13'</text>
    <text x="320" y="128">22' × 16'</text>
    <text x="520" y="98">12' × 11'</text>
    <text x="120" y="358">12' × 11'</text>
    <text x="320" y="358">11' × 9'</text>
  </g>
  <text x="620" y="436" text-anchor="end" font-size="10" fill="#5a6680">Demo plan · not to scale</text>
</svg>
